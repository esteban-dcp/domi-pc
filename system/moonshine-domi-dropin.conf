[Service]
# Render del compositor en la NVIDIA (ruta estable, no renderD12x)
Environment=MOONSHINE_RENDER_NODE=/dev/dri/by-path/pci-@NV_PCI@-render
# Encoder Vulkan Video solo ve la NVIDIA (pixelforge toma el primer device)
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/nvidia_icd.json
# Si la máquina se queda sin RAM, que muera antes el stream que la sesión del administrador
OOMScoreAdjust=300
# Solo el servicio puede crear mandos virtuales (/dev/uinput es del grupo input por reglas udev de otras herramientas).
# Los juegos de domi se lanzan en su sesión de usuario y NO heredan estos grupos.
SupplementaryGroups=moonshine input
