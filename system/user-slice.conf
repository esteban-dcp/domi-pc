# Límites de la sesión de Domi (juegos + Steam). Moonshine va aparte en system-moonshine.slice.
# Paralives usó ~7 GB en la prueba LAN; a partir de MemoryHigh el kernel recupera memoria de Domi
# antes que la de el administrador; MemoryMax es el techo duro (OOM solo dentro de la sesión de Domi).
[Slice]
MemoryHigh=9G
MemoryMax=11G
CPUWeight=90
